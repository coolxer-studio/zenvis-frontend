<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZenVis 插件页面</title>
    <link rel="stylesheet" href="/amis/plugin-ui/v1/zenvis-plugin-ui.css" />
    <script src="/amis/plugin-ui/v1/zenvis-plugin-ui.js"></script>
  </head>
  <body>
    <main class="zv-page">
      <section class="zv-grid zv-grid--metrics">
        <article class="zv-metric-card zv-tone-primary">
          <span class="zv-metric-label">指标名称</span>
          <strong class="zv-metric-value" id="metricValue">0</strong>
          <span class="zv-metric-help">指标说明</span>
        </article>
      </section>
      <section class="zv-chart-card" id="chartContainer"></section>
    </main>
    <script>
      window.ZenVisPluginUI.onReady(function (ui) {
        ui.observeResize(document.getElementById('chartContainer'), function () {
          // 在此调用图表实例的 resize 方法。
        });
      });
    </script>
  </body>
</html>
